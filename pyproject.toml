[project]
name = "synor"
version = "0.1.0"
description = "Synor: An organic, from-scratch generative AI foundation model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
